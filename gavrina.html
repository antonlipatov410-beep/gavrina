<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Татьяна Гаврина — художник</title>
<meta name="description" content="Интерьерный художник Татьяна Гаврина: помогу подобрать картину в ваш интерьер и выполню её в разных техниках.">
<meta property="og:title" content="Интерьерный художник Татьяна Гаврина">
<meta property="og:description" content="Все ссылки: Telegram, ВКонтакте, Ярмарка Мастеров, Instagram">
<meta name="theme-color" content="#f4eee6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4eee6;
    --paper:#fbf8f3;
    --ink:#2a2320;
    --muted:#7c6f66;
    --line:#e4d9cc;
    --accent:#b0614f;
    --accent-soft:#efdcd3;
    --shadow:0 1px 2px rgba(60,40,30,.06),0 8px 24px -12px rgba(60,40,30,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(1200px 600px at 110% -10%, #ead8cb 0%, transparent 60%),
      radial-gradient(900px 500px at -20% 110%, #e6ddd0 0%, transparent 55%);
    color:var(--ink);
    font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
    padding:48px 16px calc(32px + env(safe-area-inset-bottom));
  }
  main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}

  .mark{
    width:104px;height:104px;border-radius:50%;
    display:grid;place-items:center;
    background:
      radial-gradient(circle at 30% 28%, #fff 0%, #f6efe8 38%, #e9d9cc 100%);
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.7);
    position:relative;
  }
  .mark::after{
    content:"";position:absolute;inset:-7px;border-radius:50%;
    border:1px solid var(--line);
  }
  .mark span{
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:44px;font-weight:600;letter-spacing:.02em;color:var(--accent);
    line-height:1;transform:translateY(-1px);
  }

  .eyebrow{
    margin-top:26px;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
  }
  h1{
    margin-top:8px;
    font-family:"Cormorant Garamond",Georgia,serif;
    font-weight:600;font-size:38px;line-height:1.05;text-align:center;
  }
  .lead{
    margin-top:12px;max-width:330px;text-align:center;
    font-size:15px;line-height:1.55;color:var(--muted);
  }
  .rule{width:44px;height:1px;background:var(--accent);opacity:.5;margin:26px 0 22px}

  nav{width:100%;display:flex;flex-direction:column;gap:12px}
  .link{
    display:flex;align-items:center;gap:14px;
    padding:14px 16px;min-height:72px;
    background:var(--paper);
    border:1px solid var(--line);border-radius:18px;
    color:inherit;text-decoration:none;
    box-shadow:var(--shadow);
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .link:hover{border-color:#d6c4b3;transform:translateY(-1px)}
  .link:active{transform:scale(.985);background:#fff}
  .ico{
    flex:none;width:44px;height:44px;border-radius:14px;
    display:grid;place-items:center;
    background:var(--accent-soft);color:var(--accent);
  }
  .ico svg{width:22px;height:22px}
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-weight:600;font-size:16px;line-height:1.25}
  .txt small{display:block;margin-top:3px;font-size:13px;color:var(--muted);line-height:1.35}
  .arr{flex:none;color:#b9a99b}
  .arr svg{width:18px;height:18px;display:block}

  footer{margin-top:34px;font-size:12px;color:#a39587;letter-spacing:.04em;text-align:center}

  @media (max-width:360px){
    h1{font-size:33px}
    .link{padding:12px 14px}
  }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"><span>ТГ</span></div>

      </span>

      <span class="ico" aria-hidden="true">

    </a>

    <a class="link" href="https://www.instagram.com/tatyana_gavrina_hudognik/">
      <span class="ico" aria-hidden="true">

  </nav>

  <footer>© Татьяна Гаврина</footer>
